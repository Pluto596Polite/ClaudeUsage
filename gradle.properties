org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Gradle 8.6 / AGP 8.4.1 do not run on JDK 22+. Build with a JDK in the 17–21 range.
# CI (see .github/workflows) provisions JDK 17. For local builds, either run under a
# 17–21 JDK by default, or point Gradle at one via a machine-local (uncommitted) setting —
# e.g. add `org.gradle.java.home=/path/to/jdk` to ~/.gradle/gradle.properties. It is left
# out of this committed file so the path isn't hard-coded to one machine.

# compileSdk 35 is newer than AGP 8.4.1 was tested against; the build works, silence the warning.
android.suppressUnsupportedCompileSdk=35
