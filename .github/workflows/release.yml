name: Release

# Builds a signed APK and publishes a GitHub Release (creating its tag). Triggers:
#   1. Push a version tag:     git tag v1.1.0 && git push origin v1.1.0
#   2. Change release.properties on the development branch (the `version=` value becomes the tag).
#   3. Run manually from the Actions tab (workflow_dispatch) with a tag input.
# The workflow's GITHUB_TOKEN creates the tag/release, so no direct tag push is required.
# The in-app updater reads the release's `tag_name` and attached `.apk` asset to prompt updates.

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'claude/**'
      - main
    paths:
      - 'release.properties'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to create/release (e.g. v1.1.0)'
        required: true
        default: 'v1.1.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Resolve tag and stage APK
        id: stage
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG=$(grep -E '^version=' release.properties | head -n1 | cut -d= -f2 | tr -d '[:space:]')
          fi
          if [ -z "$TAG" ]; then
            echo "Could not resolve a release tag." >&2
            exit 1
          fi
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "No APK found under app/build/outputs/apk/release" >&2
            exit 1
          fi
          DEST="claude-usage-${TAG}.apk"
          cp "$APK" "$DEST"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk=$DEST" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.stage.outputs.tag }}"
          APK="${{ steps.stage.outputs.apk }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --generate-notes
          fi
